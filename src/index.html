<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css"/>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <link rel="preload" href="./data/index.json" as="fetch" type="application/json" crossorigin="anonymous">
</head>
<body>
    <datalist id="datalist-search-city"></datalist>

    <header>
        <h1>Mapa de São Paulo</h1>

        <fieldset>
            <img alt="search" src="./assets/search.svg" />
            <input type="text" id="inp-search-city" list="datalist-search-city" placeholder="... São Caetano do Sul"/>
            <img alt="search" src="./assets/send.svg" />
        </fieldset>
    </header>

    <main>
        <aside>
            <ul id="list-cities"></ul>
        </aside>
        <div id="map"></div>
    </main>

    <script type="module" src="./script.ts"></script>
</body>
</html>
