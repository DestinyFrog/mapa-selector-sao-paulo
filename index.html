<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css"/>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <link rel="preload" href="./data/index.json" as="fetch" type="application/json" crossorigin="anonymous">
</head>
<body>
    <datalist id="datalist-search-city"></datalist>

    <header>
        <h1>Mapa de São Paulo</h1>

        <fieldset>
            <svg preserveAspectRatio="xMidYMid meet" class="lucide lucide-search" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24" width="20" height="20"
                fill="none" stroke="#000000" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" >
                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />
            </svg>

            <input type="text" id="inp-search-city" list="datalist-search-city" placeholder="... São Caetano do Sul"/>

            <svg xmlns="http://www.w3.org/2000/svg" id="but-add-city"
                viewBox="0 -960 960 960" width="20" height="20" fill="#000000">
                <path d="M140-190v-580l688.46 290L140-190Zm60-90 474-200-474-200v147.69L416.92-480 200-427.69V-280Zm0 0v-400 400Z"/>
            </svg>
            </svg>
        </fieldset>
    </header>

    <main>
        <aside>
            <ul id="list-cities"></ul>
        </aside>
        <div id="map"></div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
